name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev build-essential git ccache autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libssl-dev
          pip install --upgrade pip setuptools buildozer cython

      - name: Build with Buildozer and Accept Licenses
        run: |
          # تشغيل التمهيد لإنشاء المجلدات
          yes | buildozer android debug || true
          
          # قبول الرخص في كافة المسارات الممكنة لـ SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n2433370233637922f6d08fdb5f1a917d1a625061" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n846400268344306573d2e7633b64033b7638 active" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\nd9753112693270b9650bf046092ee2b170900317" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # إعادة البناء بعد قبول الرخص
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: KrotApp-APK
          path: bin/*.apk
