name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev build-essential git ccache autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libssl-dev
          pip install --upgrade pip setuptools buildozer cython

      - name: Build with Buildozer
        run: |
          # تجهيز مجلد الرخص مسبقاً وتخطي المطالبة
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # قبول الرخص التلقائي أثناء البناء
          export BUILDOZER_ACCEPT_SDK_LICENSES=1
          buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: KrotApp-APK
          path: bin/*.apk
